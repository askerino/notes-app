name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare environment
        run: cp .env.example .env

      - name: Start E2E database
        run: docker compose up -d --wait db-e2e

      - name: Backend format and tests
        working-directory: backend
        run: |
          dotnet format NotesApp.slnx --verify-no-changes
          dotnet test --solution NotesApp.slnx -c Release

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify generated API types
        run: |
          (cd frontend && npm run api:generate)
          git diff --exit-code -- backend/src/NotesApp.Api/openapi.json frontend/src/api/generated/schema.d.ts

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
