x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:18
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-e2e:
    image: postgres:18
    profiles: [e2e]
    logging: *default-logging
    environment:
      POSTGRES_DB: ${E2E_POSTGRES_DB}
      POSTGRES_USER: ${E2E_POSTGRES_USER}
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    logging: *default-logging
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppDatabase: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA}
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

volumes:
  db_data:
